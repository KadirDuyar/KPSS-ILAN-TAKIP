name: scan
on:
  schedule:
    - cron: "7,37 * * * *"      # 30 dakikada bir (GitHub gecikebilir; kritik değil)
  workflow_dispatch: {}          # elle çalıştır: Actions sekmesi -> scan -> Run workflow
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tara ve eşleştir
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Supabase: Session pooler bağlantı adresi
        run: python -m kpss
