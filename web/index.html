<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPSS İlan Takip</title>
<meta name="description" content="Kamu personel ilanlarını profiline göre süzen kişisel takip paneli.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5b6472;--line:#e3e6eb;--accent:#2563eb;--accent-ink:#fff;
  --ok:#0f7a3d;--ok-bg:#e6f5ec;--chk:#8a5a00;--chk-bg:#fff3d6;--no:#b3261e;--no-bg:#fde8e6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1217;--card:#171b22;--ink:#e8ebf0;--mute:#9aa4b2;--line:#262c36;--accent:#6ea0ff;--accent-ink:#0b1220;
  --ok:#5fd18a;--ok-bg:#10281a;--chk:#f2c35b;--chk-bg:#2c2208;--no:#ff8a80;--no-bg:#33140f;}}
:root[data-theme=dark]{--bg:#0f1217;--card:#171b22;--ink:#e8ebf0;--mute:#9aa4b2;--line:#262c36;--accent:#6ea0ff;--accent-ink:#0b1220;
  --ok:#5fd18a;--ok-bg:#10281a;--chk:#f2c35b;--chk-bg:#2c2208;--no:#ff8a80;--no-bg:#33140f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
nav{display:flex;gap:4px;margin-left:8px}
nav button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
nav button[aria-current=true],.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sp{flex:1}
.who{color:var(--mute);font-size:13px}
button.plain{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:4px}
button.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{flex:1;min-width:180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:2px 0 4px;font-size:15.5px;line-height:1.35}
.meta{color:var(--mute);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;margin-right:6px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.check{background:var(--chk-bg);color:var(--chk)}.badge.no{background:var(--no-bg);color:var(--no)}
.pos{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13.5px}
.pos b{font-weight:600}.pos ul{margin:4px 0 0;padding-left:18px;color:var(--mute)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
a{color:var(--accent)}
details.src{margin-top:8px;font-size:12.5px;color:var(--mute)}
details.src code{word-break:break-all}
.empty,.notice{padding:28px 16px;text-align:center;color:var(--mute)}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;margin:16px 0}
.err{color:var(--no)}.okmsg{color:var(--ok)}
.auth{max-width:360px;margin:12vh auto 0}
.auth label,.form label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.auth input{width:100%}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 16px;padding:6px 16px 16px}
legend{font-weight:650;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 14px}
.grid label{margin-top:12px}.grid input,.grid select{width:100%}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.row input,.row select{flex:1;min-width:110px}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.checks label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:14px}
textarea{width:100%;min-height:64px}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
