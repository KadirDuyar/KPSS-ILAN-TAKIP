<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KPSS İlan Takip</title><meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ok:#12805c;--ck:#b54708;--no:#b42318;--ac:#2457d6}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1319;--card:#171d26;--tx:#e8ecf1;--mu:#98a2b3;--bd:#262f3b;--ok:#4ade9f;--ck:#fbbf4d;--no:#f97066;--ac:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header,main{max-width:860px;margin:0 auto;padding:12px 14px}h1{font-size:20px;margin:6px 0 2px}
.mu{color:var(--mu);font-size:13px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
input{flex:1 1 180px}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.b{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.check{color:var(--ck)}.none{color:var(--mu)}.hot{color:var(--no);font-weight:600}
h2{font-size:15px;margin:6px 0 2px}ul{margin:6px 0;padding-left:18px;color:var(--mu);font-size:13px}
.pos{font-size:13px;margin:2px 0}a.go{display:inline-block;margin-top:6px;color:var(--ac);font-weight:600;text-decoration:none}
</style></head><body>
<header><h1>KPSS İlan Takip</h1><div class="mu" id="meta">yükleniyor…</div>
<div class="bar"><select id="prof"></select><input id="q" placeholder="Ara: kurum, unvan…">
<select id="typ"><option value="">Tüm türler</option></select><select id="src"><option value="">Tüm kaynaklar</option></select></div>
<div class="bar" id="lv"></div></header><main id="list"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LB={ok:"Uygun",check:"Kontrol et",none:"Eşleşmedi"};let D,S={lv:"check"};
const LV=[["ok","Uygun"],["check","Uygun + Kontrol"],["all","Tümü"]];
const fmt=d=>d?new Date(d).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"süre belirtilmemiş";
const left=d=>d?Math.ceil((new Date(d)-Date.now())/864e5):null;
const lvl=i=>(i.match[$("#prof").value]||{}).level||"none";
function ok(i){const l=lvl(i);return S.lv==="all"||l==="ok"||(S.lv==="check"&&l==="check")}
function render(){
  const q=$("#q").value.toLocaleLowerCase("tr"),t=$("#typ").value,s=$("#src").value;
  const L=D.ilanlar.filter(i=>ok(i)&&(!t||i.type===t)&&(!s||i.source===s)&&(!q||(i.title+" "+i.institution+" "+i.positions.map(p=>p.unvan).join(" ")).toLocaleLowerCase("tr").includes(q)));
  $("#lv").innerHTML=LV.map(([k,n])=>`<button class="${S.lv===k?"on":""}" data-k="${k}">${n}</button>`).join("");
  $("#list").innerHTML=L.length?L.map(card).join(""):'<p class="mu">Bu filtreyle ilan yok.</p>';
}
function card(i){
  const l=lvl(i),m=i.match[$("#prof").value]||{reasons:[]},d=left(i.deadline),hot=d!==null&&d<=2;
  return `<div class="card"><div class="top"><span class="b ${l}">${LB[l]}</span><span class="${hot?"hot":"mu"}">son: ${fmt(i.deadline)}${d!==null?` (${d} gün)`:""}</span></div>
  <h2>${esc(i.title)}</h2><div class="mu">${esc(i.institution)} · ${esc(i.type||i.source)}</div>
  ${i.positions.map(p=>`<div class="pos">• ${esc(p.unvan)} ${p.types.length?"· "+esc(p.types.slice(0,3).join("/")):""}${p.min?" ≥"+p.min:""} ${p.il?"· "+esc(p.il):""}</div>`).join("")}
  ${m.reasons.length?`<ul>${m.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
  <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">İlana git →</a>
  ${i.external?` <a class="go" href="${esc(i.external)}" target="_blank" rel="noopener noreferrer">Dış başvuru →</a>`:""}
  <div class="mu" style="margin-top:6px;font-size:12px">Kaynak: ${esc(i.source)} · son kontrol: ${fmt(i.last_seen)}${(i.refs||[]).length?` · <details style="display:inline"><summary style="display:inline;cursor:pointer">veri adresleri</summary>${i.refs.map(r=>`<div>${esc(r.kind)}: ${esc(r.url)}</div>`).join("")}</details>`:""}</div></div>`;
}
fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{D=j;
  $("#meta").textContent=`${j.ilanlar.length} aktif ilan · güncelleme: ${new Date(j.generated).toLocaleString("tr-TR")}`;
  $("#prof").innerHTML=j.profiles.map(p=>`<option>${esc(p)}</option>`).join("");
  for(const [id,k] of [["typ","type"],["src","source"]])[...new Set(j.ilanlar.map(i=>i[k]).filter(Boolean))].forEach(v=>$("#"+id).insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));
  render()}).catch(()=>$("#meta").textContent="data.json okunamadı (python -m http.server -d web ile aç)");
document.addEventListener("input",render);document.addEventListener("change",render);
$("#lv").addEventListener("click",e=>{if(e.target.dataset.k){S.lv=e.target.dataset.k;render()}});
</script></body></html>
